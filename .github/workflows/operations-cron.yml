# Calls Shopverse's scheduler every 15 minutes: low-stock alerts and the daily
# digest. Set two repository secrets (Settings -> Secrets and variables ->
# Actions): APP_URL (e.g. https://shop.example.com) and CRON_SECRET (the same
# value as the app's CRON_SECRET). Without them this workflow does nothing.
name: Operations scheduler

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/cron/operations
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET not set; skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 120 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/operations"
